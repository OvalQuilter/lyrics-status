<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lyrics Status</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:          #0c0d0f;
            --surface:     #131518;
            --surface-hi:  #1a1d21;
            --border:      rgba(255,255,255,.08);
            --border-hi:   rgba(99,179,237,.55);
            --border-focus:rgba(99,179,237,.8);
            --text:        #e8e9eb;
            --text-soft:   #a0a3a8;
            --muted:       #5a5e66;
            --accent:      #63b3ed;
            --accent-glow: rgba(99,179,237,.18);
            --green:       #4ade80;
            --green-dim:   rgba(74,222,128,.12);
            --red:         #f87171;
            --red-dim:     rgba(248,113,113,.12);
            --amber:       #fbbf24;
            --radius:      7px;
            --radius-lg:   10px;
            --shadow:      0 1px 3px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.25);
            --shadow-lg:   0 8px 32px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
            --font:        'Geist', system-ui, sans-serif;
            --mono:        'Geist Mono', 'Courier New', monospace;
        }

        html, body { height: 100%; background: var(--bg); }
        body { font-family: var(--font); color: var(--text); font-size: 13px; line-height: 1.55; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

        body::before {
            content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-size: 128px;
        }

        #app { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 40px 28px 80px; }

        header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .header-icon { width: 38px; height: 38px; border-radius: 9px; background: linear-gradient(135deg, #1a2a3a 0%, #0f1a28 100%); border: 1px solid rgba(99,179,237,.2); display: flex; align-items: center; justify-content: center; font-size: 17px; box-shadow: 0 0 12px rgba(99,179,237,.1); flex-shrink: 0; }
        header h1 { font-size: 16px; font-weight: 600; letter-spacing: -.025em; color: var(--text); }
        header p { margin-top: 1px; font-size: 11.5px; color: var(--muted); letter-spacing: .01em; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        #version { font-family: var(--mono); font-size: 10.5px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.05); color: var(--muted); border: 1px solid var(--border); letter-spacing: .03em; }

        #status-dot { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.04); border: 1px solid var(--border); }
        #status-dot .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background .3s; }
        #status-dot.connected .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
        #status-dot.error .dot { background: var(--red); box-shadow: 0 0 6px var(--red); }

        #save-indicator { font-size: 11px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.04); border: 1px solid var(--border); color: var(--muted); transition: all .2s; display: flex; align-items: center; gap: 5px; }
        #save-indicator .si-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); transition: background .2s; }
        #save-indicator.pending { border-color: rgba(251,191,36,.3); color: var(--amber); }
        #save-indicator.pending .si-dot { background: var(--amber); box-shadow: 0 0 5px var(--amber); }
        #save-indicator.saved { border-color: rgba(74,222,128,.25); color: var(--green); }
        #save-indicator.saved .si-dot { background: var(--green); box-shadow: 0 0 5px var(--green); }

        .section { margin-bottom: 6px; border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--border); overflow: hidden; transition: border-color .15s; }
        .section:hover { border-color: rgba(255,255,255,.11); }
        .section-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; cursor: pointer; user-select: none; gap: 12px; }
        .section-header:hover { background: rgba(255,255,255,.02); }
        .section-header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .section-icon { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; background: rgba(255,255,255,.05); border: 1px solid var(--border); }
        .section-title { font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
        .section-desc { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
        .section-chevron { color: var(--muted); font-size: 10px; transition: transform .2s cubic-bezier(.4,0,.2,1); flex-shrink: 0; }
        .section.open .section-chevron { transform: rotate(180deg); }
        .section-body { padding: 0 18px 18px; display: none; border-top: 1px solid var(--border); }
        .section.open .section-body { display: block; }

        .row { display: flex; align-items: flex-start; gap: 14px; margin-top: 13px; }
        .row-label { width: 165px; min-width: 165px; font-size: 12px; font-weight: 500; color: var(--text-soft); padding-top: 6px; }
        .row-field { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .row-inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        small.hint { font-size: 11px; color: var(--muted); line-height: 1.5; }
        small.hint code { font-family: var(--mono); font-size: 10.5px; background: rgba(255,255,255,.06); padding: 1px 4px; border-radius: 3px; color: var(--text-soft); }

        input[type=text], input[type=number], textarea, select { background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.1); border-radius: var(--radius); color: var(--text); font-family: var(--font); font-size: 12.5px; padding: 6px 10px; outline: none; transition: border-color .15s, box-shadow .15s, background .15s; }
        input[type=text]:focus, input[type=number]:focus, textarea:focus, select:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--accent-glow); background: rgba(255,255,255,.075); }
        input[type=text].full, textarea.full { width: 100%; }
        input[type=number] { width: 86px; }
        textarea { resize: vertical; min-height: 68px; line-height: 1.5; }
        input.invalid { border-color: var(--red) !important; box-shadow: 0 0 0 3px var(--red-dim) !important; }

        select { appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 28px; background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%235a5e66' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 9px center; }
        select:focus { background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2363b3ed' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); }

        .check-row { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 12.5px; color: var(--text-soft); }
        .check-row:hover { color: var(--text); }
        input[type=checkbox] { width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer; }

        button { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 30px; padding: 0 12px; border: 1px solid rgba(255,255,255,.1); border-radius: var(--radius); font-family: var(--font); font-size: 12px; font-weight: 500; cursor: pointer; transition: background .12s, border-color .12s, transform .08s, box-shadow .12s; background: rgba(255,255,255,.07); color: var(--text-soft); white-space: nowrap; }
        button:hover { background: rgba(255,255,255,.11); border-color: rgba(255,255,255,.16); color: var(--text); }
        button:active { transform: translateY(1px); }
        button.primary { background: var(--accent); color: #07111d; border-color: transparent; box-shadow: 0 2px 10px rgba(99,179,237,.3); font-weight: 600; }
        button.primary:hover { background: #7ec8f5; box-shadow: 0 2px 14px rgba(99,179,237,.45); }
        button.success { background: var(--green-dim); color: var(--green); border-color: rgba(74,222,128,.25); }
        button.danger  { background: var(--red-dim); color: var(--red); border-color: rgba(248,113,113,.25); }
        button.icon-btn { width: 28px; height: 28px; padding: 0; font-size: 13px; color: var(--muted); }
        button.icon-btn:hover { color: var(--text); }

        .auth-bottom { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
        #spotify-ok { font-size: 11.5px; color: var(--green); display: none; }
        #spotify-ok.show { display: inline; }

        .preview-badge { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 14px; background: rgba(255,255,255,.03); font-family: var(--mono); font-size: 11.5px; white-space: nowrap; color: var(--text-soft); }

        .sub-box { margin-top: 10px; padding: 12px 14px 14px; border-radius: var(--radius); background: rgba(0,0,0,.2); border: 1px solid var(--border); display: none; }
        .sub-box.show { display: block; }

        .divider { height: 1px; background: var(--border); margin: 14px 0; }
        .indent { margin-left: 24px; }

        #source-list { list-style: none; display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
        #source-list li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius); background: rgba(255,255,255,.03); border: 1px solid var(--border); cursor: grab; user-select: none; transition: background .12s, border-color .12s, box-shadow .12s; }
        #source-list li:hover { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.12); }
        #source-list li.drag-over { border-color: var(--accent); background: var(--accent-glow); box-shadow: 0 0 0 2px var(--accent-glow); }
        #source-list li.dragging { opacity: .35; }
        .drag-handle { color: var(--muted); font-size: 13px; cursor: grab; line-height: 1; transition: color .12s; }
        #source-list li:hover .drag-handle { color: var(--text-soft); }
        .source-name { flex: 1; font-size: 12.5px; font-weight: 500; }
        .source-desc { font-size: 11px; color: var(--muted); }
        .source-badge { font-family: var(--mono); font-size: 10px; padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--muted); }

        #restore-status-display { font-size: 12.5px; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 999; animation: fadeIn .15s ease; }
        .modal-box { background: #181b1f; border: 1px solid rgba(255,255,255,.12); border-radius: var(--radius-lg); max-width: 520px; width: 92%; box-shadow: var(--shadow-lg); overflow: hidden; animation: slideUp .2s cubic-bezier(.4,0,.2,1); }
        .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: rgba(255,255,255,.03); border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
        .modal-body { padding: 16px; font-size: 12.5px; line-height: 1.65; color: var(--text-soft); }
        .modal-body code { font-family: var(--mono); font-size: 11.5px; background: rgba(255,255,255,.07); padding: 1px 5px; border-radius: 3px; color: var(--text); }
        .modal-body strong { color: var(--text); font-weight: 600; }
        .modal-body a { color: var(--accent); }
        .modal-close { cursor: pointer; opacity: .5; font-size: 15px; line-height: 1; color: var(--text); padding: 2px; border-radius: 3px; }
        .modal-close:hover { opacity: 1; background: rgba(255,255,255,.08); }

        #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .toast { display: flex; align-items: center; gap: 9px; padding: 10px 14px; border-radius: var(--radius); background: #1e2125; border: 1px solid rgba(255,255,255,.12); box-shadow: var(--shadow-lg); font-size: 12.5px; color: var(--text); animation: toastIn .25s cubic-bezier(.4,0,.2,1) forwards; min-width: 220px; max-width: 340px; }
        .toast.out { animation: toastOut .2s ease forwards; }
        .toast-icon { font-size: 13px; flex-shrink: 0; }
        .toast.success .toast-icon { color: var(--green); }
        .toast.error   .toast-icon { color: var(--red); }
        .toast.info    .toast-icon { color: var(--accent); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.18); }

        @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes toastIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes toastOut{ from { opacity: 1; transform: translateX(0); }  to { opacity: 0; transform: translateX(16px); } }

        .help-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
        .help-table th { text-align: left; padding: 3px 10px 5px 0; color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
        .help-table td { padding: 4px 10px 4px 0; border-bottom: 1px solid rgba(255,255,255,.05); vertical-align: top; }
        .help-table tr:last-child td { border-bottom: none; }

        #spotify-token-status { font-size: 12px; color: var(--muted); white-space: nowrap; }

        /* Presence status toggle */
        .presence-toggle { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
        .presence-btn { height: 28px; padding: 0 12px; font-size: 12px; border-radius: var(--radius); border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); color: var(--text-soft); cursor: pointer; transition: background .12s, border-color .12s, color .12s, box-shadow .12s; }
        .presence-btn:hover { background: rgba(255,255,255,.1); color: var(--text); }
        .presence-btn.presence-active[data-value="online"] { background: rgba(74,222,128,.15); border-color: rgba(74,222,128,.45); color: var(--green); box-shadow: 0 0 0 2px rgba(74,222,128,.12); }
        .presence-btn.presence-active[data-value="idle"]   { background: rgba(251,191,36,.15); border-color: rgba(251,191,36,.45); color: var(--amber); box-shadow: 0 0 0 2px rgba(251,191,36,.12); }
        .presence-btn.presence-active[data-value="dnd"]    { background: rgba(248,113,113,.15); border-color: rgba(248,113,113,.45); color: var(--red);   box-shadow: 0 0 0 2px rgba(248,113,113,.12); }
    </style>
</head>
<body>
<div id="app">
    <header>
        <div class="header-left">
            <div class="header-icon">&#127925;</div>
            <div>
                <h1>Lyrics Status</h1>
                <p>Discord custom status synced to your Spotify playback.</p>
            </div>
        </div>
        <div class="header-right">
            <div id="save-indicator"><span class="si-dot"></span><span class="si-label">Saved</span></div>
            <div id="status-dot"><span class="dot"></span><span class="ws-label">Connecting</span></div>
            <span id="version">v3</span>
        </div>
    </header>
    <div id="sections"></div>
</div>
<div id="toast-container"></div>
<script src="panel.js"></script>
</body>
</html>
