name: Release
on:
  push:
    tags:
      - 'v*'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  release:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build release zip
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME
          $ZIP_NAME = "lyrics-status-$VERSION.zip"
          $STAGING = "staging-$VERSION"

          New-Item -ItemType Directory -Path $STAGING -Force | Out-Null
          Copy-Item -Recurse dist, src, static, res, package.json, package-lock.json, tsconfig.json, README.md, CHANGELOG.txt, VERSION -Destination $STAGING

          Remove-Item "$STAGING\dist\_check.js","$STAGING\dist\instrument.js" -ErrorAction SilentlyContinue
          Remove-Item "$STAGING\dist\_fix*.js" -ErrorAction SilentlyContinue
          Remove-Item "$STAGING\dist\*_patch.txt" -ErrorAction SilentlyContinue

          Compress-Archive -Path "$STAGING\*" -DestinationPath $ZIP_NAME -Force
          Remove-Item -Recurse -Force $STAGING

          "ZIP_NAME=$ZIP_NAME" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true